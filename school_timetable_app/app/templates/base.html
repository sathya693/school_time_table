<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Timetable{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .lunch-break {
            background-color: #f0f0f0 !important;
            font-style: italic;
            color: #888;
        }
        .hidden { display: none; }
        .assignment-block {
            border: 1px solid #ccc;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
        }
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .preferences-grid {
            display: grid;
            gap: 2px;
            margin-top: 1rem;
            align-items: center;
            background-color: #ddd;
            border: 1px solid #ccc;
        }
        .pref-grid-row {
            display: contents; /* Core part of making the row a "virtual" container */
        }
        .pref-grid-cell {
            text-align: center;
            padding: 4px;
            background-color: #fff;
            font-size: 0.85rem;
        }
        .pref-grid-cell.day-label, .pref-grid-cell.period-label {
            font-weight: 500;
            background-color: #f2f2f2;
        }
        .pref-btn {
            padding: 4px 8px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            line-height: 1.2;
        }
        .pref-btn.active {
            background-color: #007bff;
            color: white;
        }
        .btn-remove-assignment {
            background-color: #dc3545;
            color: white;
        }
        .summary-section {
            margin-bottom: 2rem;
        }
        .status-shortage {
            color: #dc3545;
            font-weight: 500;
        }
        .status-surplus {
            color: #28a745;
            font-weight: 500;
        }
        .error-cell {
            color: #dc3545;
            font-style: italic;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">Timetable Pro</a>
            <ul class="navbar-nav">
                <li><a href="{{ url_for('main.setup') }}">Setup</a></li>
                <li><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
