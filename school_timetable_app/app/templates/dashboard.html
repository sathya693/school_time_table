{% extends "base.html" %}
{% block title %}Dashboard - {{ super() }}{% endblock %}

{% block content %}
<div class="dashboard-container">
    <header class="dashboard-header">
        <h1>Timetable Dashboard</h1>
        <div class="controls">
            <button id="btn-generate">Generate Timetable</button>
            <button id="btn-validate">Validate</button>
            <button id="btn-edit-mode">Enable Edit Mode</button>
        </div>
    </header>

    <aside class="sidebar">
        <h2>View Options</h2>
        <div class="view-selector">
            <label for="view-type">View by:</label>
            <select id="view-type">
                <option value="section">Grade/Section</option>
                <option value="teacher">Teacher</option>
                <option value="classroom">Classroom</option>
            </select>
        </div>
        <div class="view-selector-value">
            <label for="view-value">Select:</label>
            <select id="view-value">
                <!-- Options will be populated by JS -->
            </select>
        </div>
        <hr>
        <h2>Conflicts & Suggestions</h2>
        <div id="conflict-panel">
            <p>No conflicts found.</p>
            <!-- Conflicts will be listed here -->
        </div>
    </aside>

    <main class="timetable-main">
        <h2 id="timetable-title">Timetable for [Selection]</h2>
        <div id="timetable-grid" class="timetable-grid">
            <p>Loading schedule...</p>
        </div>
    </main>
</div>
{% endblock %}
